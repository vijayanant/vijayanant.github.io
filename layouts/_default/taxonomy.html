{{ define "main" }}
<section class="section-archive">
  <div class="container archive-container">
    <header class="archive-header">
      <span class="archive-eyebrow">{{ .Data.Singular | title }}</span>
      <h1 class="archive-title">{{ .Title }}</h1>
      <p class="archive-intro">Essays tagged with <span class="tag-highlight">{{ .Title }}</span>.</p>
    </header>

    <div class="archive-years">
      {{ range .Pages.GroupByDate "2006" }}
        <div class="archive-year-group">
          <h2 class="archive-year-heading">{{ .Key }}</h2>
          <ul class="archive-list">
            {{ range .Pages }}
              <li class="archive-item">
                <a href="{{ .Permalink }}" class="archive-link">
                  <span class="archive-item-date">{{ .Date.Format "Jan 02" }}</span>
                  <span class="archive-item-title">{{ .Title }}</span>
                  <span class="archive-item-meta">{{ .ReadingTime }}m</span>
                </a>
              </li>
            {{ end }}
          </ul>
        </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
