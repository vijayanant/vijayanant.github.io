<section id="workshops">
    <div class="container">
        <h2 class="section-title">Corporate Training & Workshops</h2>
        <p class="section-intro">I help teams bridge the gap between theory and practice.</p>
        <div class="blog-grid">
            {{ $workshops := where .Site.RegularPages "Section" "workshops" }}
            {{ range $workshops }}
                {{ partial "data-card.html" . }}
            {{ end }}
        </div>
        <div class="text-center" style="margin-top: 3rem;">
            <a href="mailto:{{ .Site.Params.contactEmail }}" class="button button-primary workshop-contact-button">Get in Touch</a>
        </div>
    </div>
</section>
