<section id="speaking" class="speaking-section">
    <div class="container">
        <h2 class="section-title">Selected Talks</h2>
        <div class="blog-grid">
            {{ $talks := where .Site.RegularPages "Type" "speaking" }}
            {{ range $talks.ByDate.Reverse }}
                {{ partial "data-card.html" . }}
            {{ end }}
        </div>
    </div>
</section>
