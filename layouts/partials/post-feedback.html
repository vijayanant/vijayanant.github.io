<section class="post-feedback" aria-label="Reader Feedback">
    <span class="feedback-label">Thoughts &amp; Counterpoints</span>
    <p class="feedback-text">
        Have a question, critique, or perspective on this essay? Drop a note to 
        <a href="mailto:{{ site.Params.contactEmail }}?subject=Re:%20{{ .Title | urlquery }}" class="feedback-email">{{ site.Params.contactEmail }}</a>. 
        I read and reply to every thoughtful message.
    </p>
</section>
