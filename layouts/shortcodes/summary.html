<div class="summary-box">
    <div class="summary-header">
        <span class="summary-eyebrow">Key Takeaways</span>
        {{ with .Get "title" }}
            {{ if ne . "Key Takeaways" }}
                <h4 class="summary-title">{{ . }}</h4>
            {{ end }}
        {{ end }}
    </div>
    <div class="summary-content">
        {{ .Inner | markdownify }}
    </div>
</div>
