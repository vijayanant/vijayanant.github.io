<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        </pattern>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="#0F172A"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    
    <!-- HUMAN HEAD (Outline) -->
    <g transform="translate(200, 150)">
        <path d="M 50,250 Q 50,50 150,50 T 250,250 L 250,300 Q 250,350 150,350 T 50,300 Z" stroke="#38BDF8" stroke-width="3" fill="none" filter="url(#glow)"/>
        <circle cx="150" cy="150" r="40" fill="rgba(56, 189, 248, 0.2)" filter="url(#glow)"/>
        <text x="150" y="155" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">MENTAL MODEL</text>
        <text x="150" y="400" fill="#38BDF8" font-family="monospace" font-size="24" text-anchor="middle">HUMAN</text>
    </g>

    <!-- THE GAP -->
    <g transform="translate(500, 200)">
        <line x1="0" y1="100" x2="200" y2="100" stroke="#F87171" stroke-width="4" stroke-dasharray="10,5"/>
        <text x="100" y="80" fill="#F87171" font-family="monospace" font-size="18" text-anchor="middle">TRUST GAP</text>
        <path d="M 80,120 L 120,120" stroke="#F87171" stroke-width="8"/>
    </g>

    <!-- AI HEAD (Outline) -->
    <g transform="translate(750, 150)">
        <rect x="50" y="50" width="200" height="300" rx="20" stroke="#F472B6" stroke-width="3" fill="none" filter="url(#glow)"/>
        <path d="M 70,100 L 230,100 M 70,150 L 230,150 M 70,200 L 150,200" stroke="#F472B6" stroke-width="2" opacity="0.5"/>
        <text x="150" y="250" fill="#F472B6" font-family="monospace" font-size="12" text-anchor="middle">CODE DUMP</text>
        <text x="150" y="400" fill="#F472B6" font-family="monospace" font-size="24" text-anchor="middle">AI</text>
    </g>

    <g transform="translate(600, 580)">
        <text fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">WHY AI CODE IS HARD TO DEBUG</text>
        <rect x="280" y="-28" width="6" height="34" fill="#38BDF8" filter="url(#glow)"/>
    </g>
</svg>
