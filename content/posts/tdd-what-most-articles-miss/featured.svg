<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        </pattern>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#F472B6" />
        </marker>
    </defs>
    <rect width="100%" height="100%" fill="#0F172A"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    <g transform="translate(600, 300)">
        <path d="M -150,0 A 150,150 0 1,1 150,0 A 150,150 0 1,1 -150,0" stroke="#F472B6" stroke-width="4" fill="none" stroke-dasharray="10,5" marker-end="url(#arrowhead)"/>
        <g transform="translate(-150, -100)">
            <rect x="-40" y="-20" width="80" height="40" rx="5" fill="#F87171" filter="url(#glow)"/>
            <text fill="#fff" font-family="monospace" font-size="14" text-anchor="middle" y="5">RED</text>
        </g>
        <g transform="translate(150, -100)">
            <rect x="-40" y="-20" width="80" height="40" rx="5" fill="#4ADE80" filter="url(#glow)"/>
            <text fill="#fff" font-family="monospace" font-size="14" text-anchor="middle" y="5">GREEN</text>
        </g>
        <g transform="translate(0, 150)">
            <rect x="-60" y="-20" width="120" height="40" rx="5" fill="#38BDF8" filter="url(#glow)"/>
            <text fill="#fff" font-family="monospace" font-size="14" text-anchor="middle" y="5">REFACTOR</text>
        </g>
        <g transform="translate(0, 0)" filter="url(#glow)">
            <rect x="-80" y="-40" width="160" height="80" rx="5" stroke="#38BDF8" stroke-width="3" fill="rgba(56, 189, 248, 0.1)"/>
            <path d="M -60,-10 L 60,-10 M -60,10 L 20,10" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
            <text x="0" y="60" fill="#38BDF8" font-family="monospace" font-size="18" text-anchor="middle">DESIGN ARTIFACT</text>
        </g>
    </g>
    <g transform="translate(600, 580)">
        <text fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">TDD IS A DESIGN DISCIPLINE</text>
        <rect x="260" y="-28" width="6" height="34" fill="#38BDF8" filter="url(#glow)"/>
    </g>
</svg>
