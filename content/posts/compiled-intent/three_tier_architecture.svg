<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" style="font-family: ui-sans-serif, system-ui, sans-serif; background: #0b0f19; border-radius: 12px; border: 1px solid #1e293b; padding: 20px;">
  <defs>
