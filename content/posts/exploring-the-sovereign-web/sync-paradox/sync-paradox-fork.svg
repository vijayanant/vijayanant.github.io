<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Mulish:wght@400;700&amp;display=swap');
      text { font-family: 'Mulish', sans-serif; fill: #333333; }
      .title { font-size: 20px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; fill: #f4f4f4; }
      .layer-bg { stroke: #333333; stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <rect width="800" height="400" fill="#ffffff" />
  
  <!-- The Root -->
  <rect x="350" y="50" width="100" height="60" class="layer-bg" fill="#005b96" />
  <text x="400" y="85" text-anchor="middle" class="label">ROOT</text>

  <!-- The Fork -->
  <path d="M 400 110 L 250 200" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M 400 110 L 550 200" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="200" y="200" width="100" height="60" class="layer-bg" fill="#005b96" />
  <text x="250" y="235" text-anchor="middle" class="label">EDIT A</text>

  <rect x="500" y="200" width="100" height="60" class="layer-bg" fill="#005b96" />
  <text x="550" y="235" text-anchor="middle" class="label">EDIT B</text>

  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
  </marker>

  <text x="400" y="320" text-anchor="middle" class="title">When Histories Diverge</text>
  <text x="400" y="350" text-anchor="middle" style="font-size: 14px; fill: #666666;">Without a central referee, two valid edits create two distinct document histories.</text>
</svg>
