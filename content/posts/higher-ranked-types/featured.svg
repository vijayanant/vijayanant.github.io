<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        </pattern>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="#0F172A"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    
    <g transform="translate(600, 300)" filter="url(#glow)">
        <text y="-50" fill="#38BDF8" font-family="monospace" font-size="120" font-weight="bold" text-anchor="middle">∀a.</text>
        <text y="50" fill="#F472B6" font-family="monospace" font-size="60" text-anchor="middle">f :: (a -> a) -> b</text>
        
        <!-- Types orbiting the forall -->
        <circle cx="-250" cy="-100" r="40" stroke="#38BDF8" fill="none" stroke-dasharray="5,2"/>
        <text x="-250" y="-95" fill="#38BDF8" font-family="monospace" font-size="14" text-anchor="middle">INT</text>
        
        <circle cx="250" cy="-100" r="40" stroke="#38BDF8" fill="none" stroke-dasharray="5,2"/>
        <text x="250" y="-95" fill="#38BDF8" font-family="monospace" font-size="14" text-anchor="middle">STRING</text>
        
        <circle cx="0" cy="150" r="40" stroke="#38BDF8" fill="none" stroke-dasharray="5,2"/>
        <text x="0" y="155" fill="#38BDF8" font-family="monospace" font-size="14" text-anchor="middle">BOOL</text>
    </g>

    <g transform="translate(600, 580)">
        <text fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">MONOMORPHISM, POLYMORPHISM, AND RANK-N TYPES</text>
        <rect x="380" y="-28" width="6" height="34" fill="#38BDF8" filter="url(#glow)"/>
    </g>
</svg>
