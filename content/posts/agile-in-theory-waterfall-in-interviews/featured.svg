<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        </pattern>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="#0F172A"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    <line x1="600" y1="50" x2="600" y2="520" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="10,10"/>
    <g transform="translate(100, 100)">
        <path d="M 50,250 Q 50,150 150,150 T 250,250 T 350,250" stroke="#38BDF8" stroke-width="4" fill="none" stroke-dasharray="8,4" filter="url(#glow)"/>
        <path d="M 50,250 C 50,350 150,350 150,250 C 150,150 250,150 250,250 C 250,350 350,350 350,250" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.3"/>
        <text x="200" y="400" fill="#38BDF8" font-family="monospace" font-size="24" text-anchor="middle">AGILE REALITY</text>
        <text x="200" y="430" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="14" text-anchor="middle">(Continuous Feedback)</text>
    </g>
    <g transform="translate(700, 100)">
        <path d="M 50,100 L 150,100 L 150,200 L 250,200 L 250,300 L 350,300 L 350,450" stroke="#F87171" stroke-width="4" fill="none" filter="url(#glow)"/>
        <circle cx="350" cy="450" r="10" fill="#F87171"/>
        <text x="200" y="400" fill="#F87171" font-family="monospace" font-size="24" text-anchor="middle">INTERVIEW CLIFF</text>
        <text x="200" y="430" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="14" text-anchor="middle">(Big Design Upfront)</text>
    </g>
    <g transform="translate(600, 580)">
        <text fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">AGILE IN THEORY, WATERFALL IN INTERVIEWS</text>
        <rect x="360" y="-28" width="6" height="34" fill="#38BDF8" filter="url(#glow)"/>
    </g>
</svg>
