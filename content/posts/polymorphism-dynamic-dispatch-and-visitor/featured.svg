<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        </pattern>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="#0F172A"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    <line x1="600" y1="50" x2="600" y2="520" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="10,10"/>
    
    <!-- SINGLE DISPATCH -->
    <g transform="translate(100, 150)">
        <rect width="120" height="60" rx="5" stroke="#38BDF8" fill="rgba(56, 189, 248, 0.1)"/>
        <text x="60" y="35" fill="#38BDF8" font-family="monospace" font-size="14" text-anchor="middle">CALLER</text>
        <line x1="120" y1="30" x2="300" y2="30" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowhead)"/>
        <rect x="300" width="120" height="60" rx="5" stroke="#38BDF8" fill="rgba(56, 189, 248, 0.1)"/>
        <text x="360" y="35" fill="#38BDF8" font-family="monospace" font-size="14" text-anchor="middle">RECEIVER</text>
        <text x="200" y="100" fill="#38BDF8" font-family="monospace" font-size="24" text-anchor="middle">SINGLE DISPATCH</text>
    </g>

    <!-- DOUBLE DISPATCH (VISITOR) -->
    <g transform="translate(700, 150)">
        <rect width="100" height="50" rx="5" stroke="#F472B6" fill="rgba(244, 114, 182, 0.1)"/>
        <text x="50" y="30" fill="#F472B6" font-family="monospace" font-size="12" text-anchor="middle">ELEMENT</text>
        
        <path d="M 100,25 Q 200,25 200,100" stroke="#F472B6" stroke-width="2" fill="none"/>
        <path d="M 200,150 Q 200,225 100,225" stroke="#38BDF8" stroke-width="2" fill="none"/>
        
        <rect x="150" y="100" width="100" height="50" rx="5" stroke="#38BDF8" fill="rgba(56, 189, 248, 0.1)" filter="url(#glow)"/>
        <text x="200" y="130" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">VISITOR</text>
        
        <text x="150" y="320" fill="#F472B6" font-family="monospace" font-size="24" text-anchor="middle">DOUBLE DISPATCH</text>
    </g>

    <g transform="translate(600, 580)">
        <text fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">POLYMORPHISM AND THE VISITOR PATTERN</text>
        <rect x="360" y="-28" width="6" height="34" fill="#38BDF8" filter="url(#glow)"/>
    </g>
</svg>
