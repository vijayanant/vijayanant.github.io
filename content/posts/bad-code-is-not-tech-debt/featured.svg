<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        </pattern>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="#0F172A"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    <line x1="600" y1="50" x2="600" y2="520" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="10,10"/>
    <g transform="translate(100, 150)">
        <rect x="50" y="100" width="300" height="20" fill="#38BDF8" filter="url(#glow)"/>
        <line x1="100" y1="120" x2="100" y2="250" stroke="#38BDF8" stroke-width="4" stroke-dasharray="5,5"/>
        <line x1="300" y1="120" x2="300" y2="250" stroke="#38BDF8" stroke-width="4" stroke-dasharray="5,5"/>
        <rect x="180" y="90" width="40" height="40" fill="#0F172A" stroke="#F472B6" stroke-width="2" stroke-dasharray="4,2"/>
        <text x="200" y="80" fill="#F472B6" font-family="monospace" font-size="14" text-anchor="middle">SKIP FEATURE X</text>
        <text x="200" y="320" fill="#38BDF8" font-family="monospace" font-size="24" text-anchor="middle">STRATEGIC DEBT</text>
        <text x="200" y="350" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="14" text-anchor="middle">(Clean Shortcut)</text>
    </g>
    <g transform="translate(700, 150)">
        <path d="M 50 100 Q 150 50, 250 150 T 350 100" stroke="#F87171" stroke-width="3" fill="none" opacity="0.6"/>
        <path d="M 70 150 Q 170 250, 270 100" stroke="#F87171" stroke-width="3" fill="none" opacity="0.4"/>
        <path d="M 100 50 L 300 250" stroke="#F87171" stroke-width="3" fill="none" opacity="0.5"/>
        <path d="M 50 200 C 150 250, 200 50, 350 150" stroke="#F87171" stroke-width="3" fill="none" opacity="0.7"/>
        <circle cx="150" cy="150" r="10" fill="#F87171" filter="url(#glow)"/>
        <circle cx="250" cy="180" r="8" fill="#F87171" filter="url(#glow)"/>
        <circle cx="80" cy="80" r="12" fill="#F87171" filter="url(#glow)"/>
        <text x="200" y="320" fill="#F87171" font-family="monospace" font-size="24" text-anchor="middle">BAD SOFTWARE</text>
        <text x="200" y="350" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="14" text-anchor="middle">(Neglect / Mess)</text>
    </g>
    <g transform="translate(600, 580)">
        <text fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">BAD CODE IS NOT TECH DEBT</text>
        <rect x="260" y="-28" width="6" height="34" fill="#38BDF8" filter="url(#glow)"/>
    </g>
</svg>
