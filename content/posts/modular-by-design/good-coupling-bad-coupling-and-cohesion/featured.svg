<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        </pattern>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="#0F172A"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    
    <!-- TIGHT COUPLING (CHAOS) -->
    <g transform="translate(100, 100)">
        <rect width="150" height="150" rx="10" stroke="#F87171" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
        <rect x="250" width="150" height="150" rx="10" stroke="#F87171" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
        <path d="M 150,50 L 250,100 M 150,80 L 250,30 M 150,120 L 250,130 M 150,30 L 250,150" stroke="#F87171" stroke-width="2" opacity="0.6"/>
        <text x="200" y="200" fill="#F87171" font-family="monospace" font-size="18" text-anchor="middle">TIGHT COUPLING</text>
    </g>

    <!-- LOOSE COUPLING (INTERFACE) -->
    <g transform="translate(100, 350)">
        <rect width="150" height="150" rx="10" stroke="#38BDF8" stroke-width="2" fill="none"/>
        <rect x="250" width="150" height="150" rx="10" stroke="#38BDF8" stroke-width="2" fill="none"/>
        <path d="M 150,75 L 250,75" stroke="#38BDF8" stroke-width="4" filter="url(#glow)"/>
        <circle cx="200" cy="75" r="10" fill="#38BDF8" filter="url(#glow)"/>
        <text x="200" y="200" fill="#38BDF8" font-family="monospace" font-size="18" text-anchor="middle">LOOSE COUPLING</text>
    </g>

    <!-- HIGH COHESION (FOCUS) -->
    <g transform="translate(700, 150)">
        <rect width="350" height="300" rx="20" stroke="#A78BFA" stroke-width="3" fill="rgba(167, 139, 250, 0.05)" filter="url(#glow)"/>
        <circle cx="100" cy="100" r="20" fill="#A78BFA" opacity="0.8"/>
        <circle cx="150" cy="150" r="20" fill="#A78BFA" opacity="0.8"/>
        <circle cx="100" cy="200" r="20" fill="#A78BFA" opacity="0.8"/>
        <circle cx="250" cy="100" r="20" fill="#A78BFA" opacity="0.8"/>
        <circle cx="200" cy="150" r="20" fill="#A78BFA" opacity="0.8"/>
        <circle cx="250" cy="200" r="20" fill="#A78BFA" opacity="0.8"/>
        <text x="175" y="350" fill="#A78BFA" font-family="monospace" font-size="24" text-anchor="middle">HIGH COHESION</text>
    </g>

    <g transform="translate(600, 580)">
        <text fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">MODULAR BY DESIGN</text>
        <rect x="180" y="-28" width="6" height="34" fill="#38BDF8" filter="url(#glow)"/>
    </g>
</svg>
