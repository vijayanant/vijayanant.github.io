<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="60%" stop-color="#0a0d16" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Technical Blueprint Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.15" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Premium Card Border Gradients -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#334155" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="magentaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#334155" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="greenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#334155" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 21px; fill: #f8fafc; font-weight: 800; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #64748b; font-weight: 500; }
    .label { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 9.5px; fill: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 0.75px; }
    .bold-value { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11.5px; fill: #cbd5e1; font-weight: 600; }
    .node-title { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: #f1f5f9; font-weight: 800; letter-spacing: -0.25px; }
    .arrow-text { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: #06b6d4; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .firewall-text { font-family: 'JetBrains Mono', monospace; font-size: 8px; fill: #f43f5e; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  </style>

  <!-- Background Layer -->
  <rect width="850" height="380" fill="url(#bgGlow)" />
  <rect width="850" height="380" fill="url(#grid)" />

  <!-- Title Block -->
  <g transform="translate(40, 35)">
    <text class="title">Zero-Trust Sync Flow</text>
    <text class="subtitle" y="24">Private client-side encryption and blind relay synchronization</text>
  </g>

  <!-- THE CRYPTOGRAPHIC FIREWALLS (Zero-Trust Boundaries) -->
  <!-- Left Firewall -->
  <g transform="translate(290, 95)">
    <line x1="0" y1="0" x2="0" y2="235" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" filter="url(#neonGlowMagenta)" />
    <rect x="-45" y="100" width="90" height="18" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-dasharray="3,1" stroke-width="1" />
    <text x="-40" y="12" class="firewall-text">Zero-Trust</text>
  </g>

  <!-- Right Firewall -->
  <g transform="translate(560, 95)">
    <line x1="0" y1="0" x2="0" y2="235" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" filter="url(#neonGlowMagenta)" />
    <rect x="-45" y="100" width="90" height="18" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-dasharray="3,1" stroke-width="1" />
    <text x="-40" y="12" class="firewall-text">Zero-Trust</text>
  </g>

  <!-- LEFT: CLIENT A (Private Zone) -->
  <g transform="translate(40, 95)">
    <!-- Soft Background Glass Card -->
    <rect width="230" height="235" rx="12" fill="url(#cardGrad)" stroke="url(#cyanBorder)" stroke-width="1.5" />
    <!-- Neon Left Accent -->
    <rect width="4" height="60" y="20" rx="2" fill="#06b6d4" filter="url(#neonGlowCyan)" />
    
    <!-- Header with Key Icon -->
    <g transform="translate(20, 25)">
      <path d="M12.65 6C11.83 3.67 9.61 2 7 2c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2V6H12.65zM7 10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="#06b6d4" transform="scale(0.8)" />
      <text x="24" y="10" class="node-title">Client A (Alice)</text>
      <text x="24" y="23" class="label" fill="#06b6d4">Private / Decrypted Zone</text>
    </g>
    
    <line x1="20" y1="65" x2="210" y2="65" stroke="#334155" stroke-opacity="0.4" />

    <!-- Document Plaintext Card -->
    <g transform="translate(20, 80)">
      <rect width="190" height="30" rx="6" fill="#0b0f19" stroke="#1e293b" />
      <text x="12" y="19" class="bold-value" fill="#94a3b8">Document (Plaintext)</text>
    </g>

    <!-- Flow indicator -->
    <path d="M 115 110 L 115 130" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Encrypt and Sign Box -->
    <g transform="translate(20, 138)">
      <rect width="190" height="74" rx="8" fill="#083344" fill-opacity="0.3" stroke="#0891b2" stroke-opacity="0.4" />
      
      <!-- Operation Row 1 (Encrypt) -->
      <g transform="translate(12, 16)">
        <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm3 8H9V7a3 3 0 0 1 6 0z" fill="#06b6d4" transform="scale(0.65)" />
        <text x="18" y="9" class="bold-value" fill="#22d3ee">1. Encrypt Data (0x57)</text>
      </g>
      
      <!-- Operation Row 2 (Sign) -->
      <g transform="translate(12, 44)">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#a78bfa" transform="scale(0.65)" />
        <text x="18" y="9" class="bold-value" fill="#c084fc">2. Sign Manifest (0x58)</text>
      </g>
    </g>
  </g>

  <!-- CENTER: THE BLIND RELAY (Untrusted Public Zone) -->
  <g transform="translate(310, 95)">
    <!-- Soft Background Glass Card -->
    <rect width="230" height="235" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />
    
    <!-- Header with Cloud Icon -->
    <g transform="translate(20, 25)">
      <!-- Cloud/Server Icon -->
      <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#64748b" transform="scale(0.8)" />
      <text x="24" y="10" class="node-title" fill="#94a3b8">Blind Relay (Server)</text>
      <text x="24" y="23" class="label" fill="#64748b">Opaque / Blind Zone</text>
    </g>
    
    <line x1="20" y1="65" x2="210" y2="65" stroke="#334155" stroke-opacity="0.4" />

    <!-- Opaque Envelopes in store -->
    <g transform="translate(20, 80)">
      <!-- Manifest Envelope -->
      <g transform="translate(0, 0)">
        <rect width="190" height="30" rx="6" fill="#090d16" stroke="#475569" stroke-opacity="0.4" />
        <!-- Key/Lock Indicator -->
        <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm3 8H9V7a3 3 0 0 1 6 0z" fill="#a78bfa" transform="translate(10, 7) scale(0.65)" />
        <text x="28" y="19" class="bold-value" fill="#a78bfa">Signed Manifest (0x58)</text>
      </g>
      
      <!-- Index Envelope -->
      <g transform="translate(0, 36)">
        <rect width="190" height="30" rx="6" fill="#090d16" stroke="#475569" stroke-opacity="0.4" />
        <!-- Locked icon -->
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="#475569" transform="translate(10, 7) scale(0.65)" />
        <text x="28" y="19" class="bold-value" fill="#64748b">Index Block (0x57)</text>
      </g>

      <!-- Data Envelope -->
      <g transform="translate(0, 72)">
        <rect width="190" height="30" rx="6" fill="#090d16" stroke="#475569" stroke-opacity="0.4" />
        <!-- Locked icon -->
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="#475569" transform="translate(10, 7) scale(0.65)" />
        <text x="28" y="19" class="bold-value" fill="#64748b">Data Block (0x57)</text>
      </g>
    </g>

    <!-- Info Footer -->
    <rect x="20" y="200" width="190" height="22" rx="4" fill="#64748b" fill-opacity="0.08" />
    <text x="28" y="214" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" font-weight="700" letter-spacing="0.25px">Relay is blind: No keys stored</text>
  </g>

  <!-- RIGHT: CLIENT B (Private Zone) -->
  <g transform="translate(580, 95)">
    <!-- Soft Background Glass Card -->
    <rect width="230" height="235" rx="12" fill="url(#cardGrad)" stroke="url(#greenBorder)" stroke-width="1.5" />
    <!-- Neon Left Accent -->
    <rect width="4" height="60" y="20" rx="2" fill="#10b981" filter="url(#neonGlowGreen)" />
    
    <!-- Header with Key Icon -->
    <g transform="translate(20, 25)">
      <path d="M12.65 6C11.83 3.67 9.61 2 7 2c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2V6H12.65zM7 10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="#10b981" transform="scale(0.8)" />
      <text x="24" y="10" class="node-title">Client B (Bob)</text>
      <text x="24" y="23" class="label" fill="#10b981">Private / Decrypted Zone</text>
    </g>
    
    <line x1="20" y1="65" x2="210" y2="65" stroke="#334155" stroke-opacity="0.4" />

    <!-- Decrypt and Verify Box -->
    <g transform="translate(20, 80)">
      <rect width="190" height="74" rx="8" fill="#064e3b" fill-opacity="0.2" stroke="#059669" stroke-opacity="0.4" />
      
      <!-- Operation Row 1 (Verify) -->
      <g transform="translate(12, 16)">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#10b981" transform="scale(0.65)" />
        <text x="18" y="9" class="bold-value" fill="#34d399">1. Verify Signature</text>
      </g>
      
      <!-- Operation Row 2 (Decrypt) -->
      <g transform="translate(12, 44)">
        <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm3 8H9V7a3 3 0 0 1 6 0z" fill="#06b6d4" transform="scale(0.65)" />
        <text x="18" y="9" class="bold-value" fill="#22d3ee">2. Decrypt Blocks</text>
      </g>
    </g>

    <!-- Flow indicator -->
    <path d="M 115 156 L 115 174" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Reassembled Document -->
    <g transform="translate(20, 182)">
      <rect width="190" height="30" rx="6" fill="#0b0f19" stroke="#1e293b" />
      <text x="12" y="19" class="bold-value" fill="#94a3b8">Document (Plaintext)</text>
    </g>
  </g>

  <!-- DATA FLOW ARROWS (Crossing Firewalls) -->
  <!-- Client A Sync -> Relay -->
  <path d="M 270 212.5 L 310 212.5" fill="none" stroke="#06b6d4" stroke-width="2.5" filter="url(#neonGlowCyan)" marker-end="url(#arrowCyan)" />
  <text x="274" y="196" class="arrow-text" fill="#06b6d4">Sync</text>

  <!-- Relay Sync -> Client B -->
  <path d="M 540 212.5 L 580 212.5" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#neonGlowGreen)" marker-end="url(#arrowGreen)" />
  <text x="544" y="196" class="arrow-text" fill="#10b981">Sync</text>

</svg>
