<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="60%" stop-color="#0a0d16" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Technical Blueprint Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.15" />
    </pattern>

    <!-- Shaded Zone Gradients -->
    <linearGradient id="publicZoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="encryptedZoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.01" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Card Border Gradients -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#334155" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="magentaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#334155" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="greenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stroke-opacity="0.8" />
      <stop offset="40%" stop-color="#334155" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 21px; fill: #f8fafc; font-weight: 800; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #64748b; font-weight: 500; }
    .label { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 9.5px; fill: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 0.75px; }
    .value { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11.5px; fill: #94a3b8; }
    .bold-value { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11.5px; fill: #cbd5e1; font-weight: 600; }
    .node-title { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: #f1f5f9; font-weight: 800; letter-spacing: -0.25px; }
    .arrow-text { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: #06b6d4; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .zone-title { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
  </style>

  <!-- Background Layer -->
  <rect width="850" height="500" fill="url(#bgGlow)" />
  <rect width="850" height="500" fill="url(#grid)" />

  <!-- Title Block -->
  <g transform="translate(40, 40)">
    <text class="title">Manifest &amp; Block DAG Resolution</text>
    <text class="subtitle" y="24">How signed manifests resolve path-keys into private encrypted blocks</text>
  </g>

  <!-- VISUAL ZONES (Illustrating the Cryptographic Separation) -->
  <!-- Zone 1: Cleartext (Signed) Public Zone -->
  <g transform="translate(25, 95)">
    <rect width="795" height="175" rx="16" fill="url(#publicZoneGrad)" stroke="#db2777" stroke-width="1.5" stroke-opacity="0.15" />
    <rect x="20" y="15" width="220" height="20" rx="4" fill="#0f172a" stroke="#db2777" stroke-width="1" stroke-opacity="0.3" />
    <text x="30" y="28" class="zone-title" fill="#db2777">Cleartext Zone (Public/Signed)</text>
  </g>

  <!-- Zone 2: Encrypted Private Zone -->
  <g transform="translate(25, 285)">
    <rect width="795" height="190" rx="16" fill="url(#encryptedZoneGrad)" stroke="#0891b2" stroke-width="1.5" stroke-opacity="0.15" />
    <rect x="20" y="15" width="230" height="20" rx="4" fill="#0f172a" stroke="#0891b2" stroke-width="1" stroke-opacity="0.3" />
    <text x="30" y="28" class="zone-title" fill="#0891b2">Encrypted Zone (Symmetric Vault)</text>
  </g>

  <!-- Decryption Barrier Arrow & Key -->
  <g transform="translate(350, 258)" filter="url(#neonGlowCyan)">
    <!-- Vertical downward arrow -->
    <path d="M 0 0 L 0 32" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)" />
    <!-- Key icon next to arrow -->
    <g transform="translate(10, 6)">
      <path d="M12.65 6C11.83 3.67 9.61 2 7 2c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2V6H12.65zM7 10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="#06b6d4" transform="scale(0.8)" />
      <text x="22" y="10" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#06b6d4" letter-spacing="0.5px">GraphKey Decryption</text>
    </g>
  </g>

  <!-- TIER 1: THE SIGNED MANIFEST (Public Entry Point) -->
  <g transform="translate(45, 110)">
    <!-- Soft Background Glass Card -->
    <rect width="280" height="145" rx="12" fill="url(#cardGrad)" stroke="url(#magentaBorder)" stroke-width="1.5" />
    <!-- Neon Left Accent -->
    <rect width="4" height="60" y="20" rx="2" fill="#ec4899" filter="url(#neonGlowMagenta)" />
    
    <!-- Header with Signature Icon -->
    <g transform="translate(20, 25)">
      <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="#ec4899" transform="scale(0.8)" />
      <text x="24" y="10" class="node-title">Graph Manifest (Cleartext)</text>
      <text x="24" y="23" class="label" fill="#db2777">Codec: 0x58 (ManifestId)</text>
    </g>
    
    <line x1="20" y1="65" x2="260" y2="65" stroke="#334155" stroke-opacity="0.4" />

    <!-- Graph ID Row -->
    <g transform="translate(20, 75)">
      <text class="label">Graph ID</text>
      <text y="15" class="value">proj_9fed7...</text>
    </g>

    <!-- Content Root Link -->
    <g transform="translate(20, 110)">
      <text class="label" fill="#06b6d4">Content Root (Points to root block)</text>
      <text x="175" y="0" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#06b6d4">-></text>
    </g>
  </g>

  <!-- TIER 2: MERKLE INDEX BLOCK (Decrypted Root) -->
  <g transform="translate(420, 110)">
    <!-- Soft Background Glass Card -->
    <rect width="380" height="145" rx="12" fill="url(#cardGrad)" stroke="url(#cyanBorder)" stroke-width="1.5" />
    <!-- Neon Left Accent -->
    <rect width="4" height="60" y="20" rx="2" fill="#06b6d4" filter="url(#neonGlowCyan)" />
    
    <!-- Header with Unlocked Icon -->
    <g transform="translate(20, 25)">
      <path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z" fill="#06b6d4" transform="scale(0.8)" />
      <text x="24" y="10" class="node-title">Root Merkle-Index (Decrypted)</text>
      <text x="24" y="23" class="label" fill="#0891b2">Codec: 0x57 (BlockId) | Type: akshara.index.v1</text>
    </g>
    
    <line x1="20" y1="65" x2="360" y2="65" stroke="#334155" stroke-opacity="0.4" />

    <!-- Index Decrypted BTreeMap -->
    <g transform="translate(20, 75)">
      <text class="label" fill="#10b981">Decrypted Index Payload (BTreeMap)</text>
      <g transform="translate(0, 10)">
        <!-- Entry 1 -->
        <g transform="translate(0, 0)">
          <rect width="340" height="22" rx="4" fill="#020617" stroke="#1e293b" />
          <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1z" fill="#94a3b8" transform="translate(8, 4) scale(0.55)" />
          <text x="22" y="15" class="bold-value" fill="#94a3b8">"profile/data"</text>
          <text x="145" y="15" class="value" fill="#10b981">-> BlockId(zQmLeafA...)</text>
        </g>

        <!-- Entry 2 -->
        <g transform="translate(0, 25)">
          <rect width="340" height="22" rx="4" fill="#020617" stroke="#1e293b" />
          <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1z" fill="#94a3b8" transform="translate(8, 4) scale(0.55)" />
          <text x="22" y="15" class="bold-value" fill="#94a3b8">"posts/content"</text>
          <text x="145" y="15" class="value" fill="#10b981">-> BlockId(zQmLeafB...)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- TIER 3: LEAF BLOCKS (Encrypted ciphertexts) -->
  <!-- Leaf A -->
  <g transform="translate(420, 335)">
    <!-- Soft Background Glass Card -->
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="url(#cyanBorder)" stroke-width="1.5" />
    <!-- Neon Left Accent -->
    <rect width="4" height="30" y="15" rx="2" fill="#06b6d4" filter="url(#neonGlowCyan)" />
    
    <!-- Header with Lock Icon -->
    <g transform="translate(16, 20)">
      <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="#06b6d4" transform="scale(0.65)" />
      <text x="18" y="10" class="node-title">Data Block A</text>
      <text x="18" y="21" class="label" fill="#0891b2">Codec: 0x57 | data</text>
    </g>
    
    <line x1="16" y1="52" x2="164" y2="52" stroke="#334155" stroke-opacity="0.4" />
    
    <g transform="translate(16, 62)">
      <text class="label">Ciphertext (Unlocked on Client)</text>
      <text y="17" class="value" fill="#475569">Encrypted payload bytes...</text>
    </g>
  </g>

  <!-- Leaf B -->
  <g transform="translate(620, 335)">
    <!-- Soft Background Glass Card -->
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="url(#cyanBorder)" stroke-width="1.5" />
    <!-- Neon Left Accent -->
    <rect width="4" height="30" y="15" rx="2" fill="#06b6d4" filter="url(#neonGlowCyan)" />
    
    <!-- Header with Lock Icon -->
    <g transform="translate(16, 20)">
      <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="#06b6d4" transform="scale(0.65)" />
      <text x="18" y="10" class="node-title">Data Block B</text>
      <text x="18" y="21" class="label" fill="#0891b2">Codec: 0x57 | data</text>
    </g>
    
    <line x1="16" y1="52" x2="164" y2="52" stroke="#334155" stroke-opacity="0.4" />
    
    <g transform="translate(16, 62)">
      <text class="label">Ciphertext (Unlocked on Client)</text>
      <text y="17" class="value" fill="#475569">Encrypted payload bytes...</text>
    </g>
  </g>

  <!-- Connection Lines and Arrows -->
  <!-- Manifest Content Root -> Root Index Block -->
  <path d="M 305 241 C 360 241, 360 182.5, 420 182.5" fill="none" stroke="#06b6d4" stroke-width="2.5" filter="url(#neonGlowCyan)" marker-end="url(#arrowCyan)" />
  <text x="320" y="200" class="arrow-text" fill="#06b6d4">Root Link</text>

  <!-- Index Entry 1 -> Leaf A -->
  <path d="M 630 217 C 630 260, 510 260, 510 335" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowCyan)" />

  <!-- Index Entry 2 -> Leaf B -->
  <path d="M 630 242 C 630 280, 710 280, 710 335" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowCyan)" />

</svg>
