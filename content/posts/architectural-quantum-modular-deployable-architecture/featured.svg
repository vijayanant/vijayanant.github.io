<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        </pattern>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="#0F172A"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    
    <!-- QUANTUM 1 -->
    <g transform="translate(100, 150)">
        <rect width="200" height="250" rx="10" stroke="#38BDF8" stroke-width="2" fill="rgba(56, 189, 248, 0.05)" filter="url(#glow)"/>
        <rect x="50" y="30" width="100" height="40" rx="5" fill="#38BDF8"/>
        <text x="100" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">UI</text>
        <rect x="50" y="90" width="100" height="60" rx="5" stroke="#38BDF8" fill="none"/>
        <text x="100" y="125" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">SERVICE</text>
        <path d="M 100,180 L 70,220 L 130,220 Z" fill="#A78BFA"/>
        <text x="100" y="240" fill="#A78BFA" font-family="monospace" font-size="10" text-anchor="middle">DB</text>
        <text x="100" y="-20" fill="#38BDF8" font-family="monospace" font-size="18" text-anchor="middle">QUANTUM A</text>
    </g>

    <!-- ASYNC LINK -->
    <path d="M 300,275 L 500,275" stroke="#F472B6" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>
    <circle cx="400" cy="275" r="5" fill="#F472B6"/>

    <!-- QUANTUM 2 -->
    <g transform="translate(500, 150)">
        <rect width="200" height="250" rx="10" stroke="#38BDF8" stroke-width="2" fill="rgba(56, 189, 248, 0.05)" filter="url(#glow)"/>
        <rect x="50" y="30" width="100" height="40" rx="5" fill="#38BDF8"/>
        <text x="100" y="55" fill="#fff" font-family="monospace" font-size="12" text-anchor="middle">UI</text>
        <rect x="50" y="90" width="100" height="60" rx="5" stroke="#38BDF8" fill="none"/>
        <text x="100" y="125" fill="#38BDF8" font-family="monospace" font-size="12" text-anchor="middle">SERVICE</text>
        <path d="M 100,180 L 70,220 L 130,220 Z" fill="#A78BFA"/>
        <text x="100" y="240" fill="#A78BFA" font-family="monospace" font-size="10" text-anchor="middle">DB</text>
        <text x="100" y="-20" fill="#38BDF8" font-family="monospace" font-size="18" text-anchor="middle">QUANTUM B</text>
    </g>

    <!-- ENTANGLED MONOLITH (Small Preview on right) -->
    <g transform="translate(850, 150)">
        <rect width="250" height="250" rx="10" stroke="#F87171" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
        <circle cx="80" cy="80" r="20" fill="#F87171" opacity="0.3"/>
        <circle cx="170" cy="170" r="20" fill="#F87171" opacity="0.3"/>
        <path d="M 80,80 L 170,170 M 80,170 L 170,80" stroke="#F87171" stroke-width="2"/>
        <text x="125" y="300" fill="#F87171" font-family="monospace" font-size="18" text-anchor="middle">ENTANGLED</text>
    </g>

    <g transform="translate(600, 580)">
        <text fill="#fff" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">ARCHITECTURAL QUANTA</text>
        <rect x="230" y="-28" width="6" height="34" fill="#38BDF8" filter="url(#glow)"/>
    </g>
</svg>
